# Project style for kernel/ Haskell sources (see Stack.hs, Loader.hs):
# 2-space indent, leading commas, diff-friendly import/export and record
# layouts, one blank line between top-level declarations.
indentation: 2
comma-style: leading
record-style: knr
import-export-style: diff-friendly
indent-wheres: true
record-brace-space: true
newlines-between-decls: 1
haddock-style: multi-line
unicode: detect

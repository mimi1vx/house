[workspace]
resolver = "2"
members = ["crates/house-boot", "crates/house-el0-tiny", "crates/house-hal", "crates/house-hal-aarch64", "crates/house-libc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"

# Internal path deps with pinned versions so `cargo deny` bans::wildcards
# stays "deny": a version-less path dep reads as `*` to the audit gate.
[workspace.dependencies]
house-hal = { path = "crates/house-hal", version = "0.1.0" }
house-hal-aarch64 = { path = "crates/house-hal-aarch64", version = "0.1.0" }

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
# Freestanding .bin: no unwinder on bare metal, so unwinding would need
# eh_personality/lang_items the RTS link never provides; abort keeps the
# flat binary linkable.
panic = "abort"

# EL0 tiny libc never panics by construction (guarded decrements only,
# pointer arithmetic is unchecked by definition); overflow checks off in
# every profile so the debug EL0 archive stays panic-free too.
# Single codegen unit: the audit (`el0tiny-check.sh`) and the probe link
# (`mk-dynamic-probe.sh`) expect exactly one crate object in the archive.
[profile.dev.package.house-el0-tiny]
overflow-checks = false
codegen-units = 1

[profile.release]
# opt-level = 2: size/speed balance for the MMU + virtio hot paths;
# 3/s/z unmeasured — change only with a .bin-size + boot-time note.
opt-level = 2
# lto = "off": full LTO across GHC RTS archives + Rust rlibs inflates link
# time/memory for a --gc-sections flat .bin; re-enable only with numbers.
lto = "off"
panic = "abort"

[profile.release.package.house-el0-tiny]
overflow-checks = false
codegen-units = 1
